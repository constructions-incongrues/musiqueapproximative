Post:
  actAs:
    Timestampable:
    Sluggable:
      fields: [track_author, track_title]
      canUpdate: true
    Searchable:
      # `body` porte la raison pour laquelle un morceau a ete poste. C'est la seule donnee
      # que ce schema rend obligatoire avec `publish_on` et le contributeur : ne pas la
      # chercher, c'est laisser ecrire pourquoi un morceau compte sans permettre de le
      # retrouver par ce qu'on en a dit.
      #
      # Le contributeur n'y entre PAS, et c'est delibere : `/posts?c=<username>` sert deja
      # cette demande. Un nom d'utilisateur verse dans l'index remonterait sur toute
      # recherche portant sur ce mot, quel que soit le morceau.
      #
      # ATTENTION : ajouter un champ ici ne reecrit pas `post_index`, qui n'est alimente
      # qu'a l'ecriture d'un Post. Les morceaux deja publies restent indexes sans leur
      # message tant que la reconstruction n'a pas ete lancee. Voir
      # docs/modules/ROOT/pages/reconstruction-index-recherche.adoc.
      fields: [track_author, track_title, body]
  columns:
    id:
      type: integer
      autoincrement: true
      primary: true
      notnull: true
    body:
      type: string
      notnull: true
    track_title: string
    track_author: string
    track_filename: string
    track_md5: string(32)
    track_duration:
      type: integer
      comment: Duree du morceau en secondes, nulle tant que non calculee
    track_size:
      type: integer
      comment: Taille du fichier en octets, nulle tant que non calculee
    buy_url: string(255)
    svn_revision: integer
    publish_on:
      type: datetime
      notnull: true
    is_online: boolean
    contributor_id:
      type: integer(4)
      notnull: true
  indexes:
    # Doctrine 1 suffixe automatiquement « _idx » : ces cles produisent
    # online_publish_idx et track_author_idx, qui sont les noms appliques en
    # production. Ne pas les renommer avec le suffixe, on obtiendrait _idx_idx.
    online_publish:
      fields: [is_online, publish_on]
    track_author:
      fields:
        track_author:
          length: 191
  relations:
    sfGuardUser:
      local: contributor_id

UserProfile:
  columns:
    user_id: { type: integer(4), notnull: true }
    display_name: { type: string(255) }
    email: { type: string(255) }
    website_url: { type: string(255) }
  indexes:
    email_index:
      fields: [email]
      unique: true
  relations:
    sfGuardUser:
      type: one
      foreignType: one
      class: sfGuardUser
      local: user_id
      foreign: id
      onDelete: cascade
      foreignAlias: UserProfile
