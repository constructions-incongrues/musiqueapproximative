# You can find more information about this file on the symfony website:
# http://www.symfony-project.org/reference/1_4/en/12-Filters

rendering: ~
security: ~

# insert your own filters here
version:
  class: VersionFilter

cache: ~

# `desastre` est déclaré SOUS `cache`, et l'ordre compte à l'envers de ce qu'on lit.
# La chaîne de filtres se déroule vers l'intérieur puis remonte : au retour, un filtre
# déclaré plus bas s'exécute avant un filtre déclaré plus haut. Déclaré au-dessus de
# `cache`, `sfDesastreFilter` injectait ses options après que `sfCacheFilter` avait écrit
# l'entrée — le bloc `window.DesastreOptions` n'était donc servi qu'au premier visiteur,
# et les suivants recevaient les scripts du désastre privés de leur configuration.
desastre:
  class: sfDesastreFilter

# Sous `cache` pour la meme raison que `desastre` : au retour de la chaine, un
# filtre declare plus bas s'execute avant un filtre declare plus haut. Le
# Content-Type doit etre reecrit avant que `sfCacheFilter` n'ecrive l'entree,
# sinon la reponse mise en cache porte le type d'origine.
json_api:
  class: JsonApiFilter

execution: ~
