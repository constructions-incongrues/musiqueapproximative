# yaml-language-server: $schema=../schemas/recettes.schema.json

# Recette du désastre « la bande usée ».
#
# Le site s'appelle Musique Approximative : ce désastre prend ce nom au mot et fait flotter
# la hauteur du morceau, comme une bande passée trop de fois.
#
# C'est le premier désastre qui touche le SON et non la page.
#
# Le processeur AudioWorklet n'est PAS listé dans `scripts:` : il vit sous `worklet/`, hors
# du dossier `javascript/` que le gestionnaire charge automatiquement. Chargé comme un
# script classique il échouerait, `AudioWorkletProcessor` n'existant pas sur le fil
# principal. Le script principal le charge lui-même par `addModule()`.
#
# Aucun `scripts:` non plus. La première livraison s'appuyait sur `desastre-audio.js` sans
# le déclarer : en développement `mangelettres` se déclenchait sur la même page et le
# chargeait, si bien que ce désastre en profitait sans l'avoir demandé. Forcé seul en
# production, il rendait « DesastreAudio absent » et ne faisait rien.
#
# Plutôt que de déclarer la dépendance, elle a été SUPPRIMÉE : son `onReady` n'appelle
# qu'après le chargement des métadonnées, alors que `createMediaElementSource()` n'a besoin
# que de l'élément. Le script cherche donc l'élément lui-même.
recettes:
  bande_usee:
    desastre: bande-usee
    enabled: true
    options:
      # Le flottement lent d'un plateau légèrement voilé.
      wowHz: 0.6
      # Le tremblement rapide d'un cabestan fatigué.
      flutterHz: 7.5
      # En millisecondes. Réglage MESURÉ et non deviné : la déviation de hauteur dépend de
      # la dérivée du retard, donc de la fréquence autant que de la profondeur. Un premier
      # jeu à 2,2 ms donnait 154 cents d'amplitude — plus d'un demi-ton, une machine cassée
      # et non une bande fatiguée. Une bande réelle tient entre dix et cinquante cents.
      profondeurMs: 0.9
      retardBaseMs: 12
      # Repli si la page ne porte pas de date lisible.
      intensite: 1
      # Usure minimale : sans plancher, 29 % des morceaux recevraient une altération
      # inaudible alors que l'en-tête X-Desastre annonce le désastre.
      plancherUsure: 0.15
      # Âge auquel l'usure est maximale. CONSTANTE et non étendue du catalogue, qui
      # grandit chaque jour et ferait dériver l'usure d'un morceau sans décision.
      referenceAns: 18
      # `article h1` porte l'artiste, `article h2` le titre. Un `h1` nu attraperait la barre
      # latérale — la page en compte trois — et `.title` est le nom du site.
      selecteurTitre: article h2
