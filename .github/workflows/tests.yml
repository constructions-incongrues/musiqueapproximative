name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Suite de tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # Les deux versions sont BLOQUANTES, et `fail-fast: false` les laisse toutes deux
    # rendre leur verdict. Une passe PHP 8 seulement consultative aurait vire au rouge
    # permanent puis a l'ignorance — c'est le mode de defaillance habituel des
    # verifications facultatives.
    #
    # 7.4 est la version de production, 8.1 la version visee. Cette matrice est ce qui
    # empeche le verdict de docs/.../compatibilite-php-8.adoc de vieillir en silence.
    # Elle a d'ailleurs trouve deux defauts que la mesure locale n'avait pas vus, des ses
    # deux premieres executions : la contrainte php de composer.json, et
    # `doctrine:insert-sql` sous PHP 8.
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1"]

    # MariaDB 10.11, la version de production — la meme que docker-compose.yml.
    #
    # Ce service etait en mysql:5.7, au motif que c'etait « la version de production »
    # et que les agregats de l'API Subsonic dependaient de ONLY_FULL_GROUP_BY, actif
    # par defaut a partir de la 5.7. Les deux moities de ce motif etaient fausses :
    #
    #   - le site n'a jamais tourne que sur MariaDB. C'est le meme constat qui avait
    #     deja fait corriger docker-compose.yml, sans que ce fichier suive ;
    #   - MariaDB 10.11 n'active PAS ONLY_FULL_GROUP_BY, et la suite passe a l'identique
    #     avec ou sans lui. Mesure faite avant la bascule, en forcant le mode sur la base
    #     locale : unitaires et fonctionnels verts des deux cotes. Ce mode n'attrapait
    #     donc rien.
    #
    # Tester sous un moteur que la production n'emploie pas ne prouve rien sur la
    # production. C'est le seul argument qui compte ici.
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: musiqueapproximative
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v6
        with:
          path: src/vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Installer les dépendances
        # `--ignore-platform-req=php` hors 7.4, et SEULEMENT hors 7.4.
        #
        # `src/composer.json` declare `"php": "^7.4"` : composer refuse donc d'installer
        # sous 8.1. C'est le seul verrou declare de toute la chaine — chaque dependance
        # annonce deja PHP 8 de son cote — et c'est la premiere chose que cette matrice
        # a trouvee.
        #
        # Le drapeau leve la verification de plateforme sans toucher a la declaration.
        # C'est delibere : la production tourne en 7.4, le projet ne pretend pas encore
        # supporter PHP 8, et cette branche sert precisement a verifier AVANT de
        # declarer. Le lock reste celui de 7.4 et n'est pas resolu a nouveau.
        #
        # La branche 7.4 garde sa verification intacte : y poser le meme drapeau
        # masquerait une vraie incompatibilite de dependance sur la version de
        # production.
        #
        # Le jour de la migration, ce drapeau disparait et la contrainte s'elargit —
        # dans cet ordre, pas l'inverse.
        run: |
          cd src
          if [ "${{ matrix.php }}" = "7.4" ]; then
            composer install --prefer-dist --no-progress
          else
            composer install --prefer-dist --no-progress --ignore-platform-req=php
          fi

      - name: Générer la configuration
        # Rendu explicite plutôt que `make configure`. La cible du Makefile
        # construit sa liste de variables à la volée et son résultat s'est
        # révélé dépendre de la façon dont on l'invoque ; ici on veut un
        # comportement déterministe et vérifiable, pas la commodité.
        env:
          APP_AUTOPLAY: "0"
          APP_DOMAIN: localhost
          APP_THEME: musiqueapproximative
          APP_TITLE: Musique Approximative
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: musiqueapproximative
          DATABASE_NAME_TEST: musiqueapproximative_test
          DATABASE_USER: root
          DATABASE_PASSWORD: root
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          # Liste blanche explicite. Sans elle, `envsubst` substitue TOUT motif
          # `$MOT`, y compris les clés `$ref` d'un document OpenAPI, qu'il
          # remplace par du vide et dont il corrompt le fichier. La liste est
          # écrite ici plutôt que déduite de l'environnement : c'est le même
          # choix d'explicite que le reste de cette étape.
          VARS='$APP_AUTOPLAY $APP_DOMAIN $APP_THEME $APP_TITLE $DATABASE_HOST $DATABASE_NAME $DATABASE_NAME_TEST $DATABASE_USER $DATABASE_PASSWORD'
          find src -name '*-dist' -print0 | while IFS= read -r -d '' dist; do
            envsubst "$VARS" < "$dist" > "${dist%-dist}"
            echo "rendu : ${dist%-dist}"
          done

      - name: Vérifier la configuration rendue
        # La substitution a déjà produit des valeurs tronquées dans un autre
        # contexte : on ne fait pas confiance, on regarde.
        run: |
          cat src/config/databases.yml
          grep -q 'dbname=musiqueapproximative_test' src/config/databases.yml \
            || { echo "::error::la connexion de test est absente"; exit 1; }
          grep -q 'username: root' src/config/databases.yml \
            || { echo "::error::identifiant de connexion incorrect"; exit 1; }
          # Le contrat n'est plus rendu : il est versionné et servi tel quel.
          # Ce qu'on vérifie n'est donc plus qu'il a reçu son domaine, mais que
          # personne ne l'a retransformé en gabarit — un rendu serait ignoré par
          # git, et le déploiement se fait par `git pull`.
          test -f src/web/openapi.yaml-dist \
            && { echo "::error::src/web/openapi.yaml-dist est réapparu : le contrat doit rester versionné, pas généré"; exit 1; }
          grep -qE '\$\{[A-Z_]+\}' src/web/openapi.yaml \
            && { echo "::error::le contrat OpenAPI porte une variable non substituée"; exit 1; }
          grep -q "\$ref: '#/components" src/web/openapi.yaml \
            || { echo "::error::les références du contrat OpenAPI ont disparu"; exit 1; }
          grep -q 'domain: localhost' src/apps/frontend/config/app.yml \
            || { echo "::error::app.yml mal rendu"; exit 1; }

      - name: Créer la base de test et poser le sql_mode de production
        # Le sql_mode releve sur la production (SELECT @@sql_mode), et non suppose.
        # L'image MariaDB y ajoute STRICT_TRANS_TABLES : sans cette ligne la CI
        # echoue sur des ecritures que la production accepte en tronquant, et
        # laisse donc passer en production le defaut qu'elle vient de signaler.
        #
        # Pourquoi ici et non dans `options:` du service : les services d'Actions
        # ne permettent pas de surcharger la commande du conteneur — `options:`
        # passe a `docker create`, avant l'image, donc `--sql-mode=...` n'y a pas
        # sa place. `SET GLOBAL` est la seule voie, et elle suffit : toute
        # connexion ouverte ensuite en herite, ce qui est le cas de toutes celles
        # de la suite. Verifie, pas suppose.
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            SET GLOBAL sql_mode='ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION';
            CREATE DATABASE IF NOT EXISTS musiqueapproximative_test CHARACTER SET utf8mb4;"
          effectif=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e "SELECT @@session.sql_mode;")
          echo "sql_mode d'une connexion neuve : $effectif"
          test "$effectif" = "ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION" \
            || { echo "::error::le sql_mode de production n'a pas pris"; exit 1; }

      - name: Construire le schéma de test
        # `doctrine:insert-sql` rend un code 1 sous PHP 8 alors qu'il a fait tout son
        # travail. Incompatibilite reelle, trouvee par cette matrice :
        #
        #   Doctrine_Export::exportClasses() ouvre une transaction, emet les CREATE
        #   TABLE puis les ALTER TABLE, et appelle commit(). Or les instructions DDL de
        #   MySQL VALIDENT IMPLICITEMENT : la transaction est deja refermee quand
        #   Doctrine la valide. PHP 7.4 laissait PDO silencieux, PHP 8 leve une
        #   PDOException « There is no active transaction ».
        #
        #   Trace : Doctrine/Transaction.php:417 <- Export.php:1224 <-
        #   sfDoctrineInsertSqlTask::execute()
        #
        # Les tables et leurs cles etrangeres sont toutes creees, sur les deux versions.
        # On asserte donc le RESULTAT plutot que le code de sortie : un `|| true` seul
        # laisserait passer un schema reellement incomplet. Le defaut est dans une
        # dependance vendue, et c'est le premier element a corriger avant une migration.
        run: |
          cd src
          php symfony doctrine:build --sql --env=test
          php symfony doctrine:insert-sql --env=test || echo "doctrine:insert-sql a rendu un code non nul, le schema est verifie ci-dessous"
          manquantes=""
          for table in post post_index sf_guard_user sf_guard_user_profile user_profile; do
            mysql -h 127.0.0.1 -uroot -proot musiqueapproximative_test -e "SELECT 1 FROM $table LIMIT 0;" >/dev/null 2>&1 || manquantes="$manquantes $table"
          done
          if [ -n "$manquantes" ]; then
            echo "::error::schema de test incomplet, tables manquantes :$manquantes"
            exit 1
          fi
          echo "schema de test complet"

      - name: Tests unitaires
        run: |
          cd src
          php symfony test:unit

      - name: Tests fonctionnels — frontend
        run: |
          cd src
          php symfony test:functional frontend

      - name: Tests fonctionnels — admin
        run: |
          cd src
          php symfony test:functional admin
