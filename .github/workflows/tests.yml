name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Suite de tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # Les deux versions sont BLOQUANTES, et `fail-fast: false` les laisse toutes deux
    # rendre leur verdict. Une passe PHP 8 seulement consultative aurait vire au rouge
    # permanent puis a l'ignorance — c'est le mode de defaillance habituel des
    # verifications facultatives.
    #
    # Ce que chaque branche mesure, et pourquoi elle est la :
    #
    #   7.4  la version SERVIE en production (plesk-php74-fpm-dedicated).
    #   8.1  le TEMOIN. Elle n'est pas une cible : releve du 2026-08-29 sur
    #        panel.pastis-hosting.net, l'hebergement ne propose que 7.4, 8.2 et 8.3, et
    #        `plesk-php81` n'est meme pas installable. Elle reste parce que tout l'audit du
    #        2026-08-19 porte sur elle : si 8.2 casse et que 8.1 passe, le defaut est date,
    #        il vient de 8.2. Sans ce temoin on ne saurait que « PHP 8 casse », ce que la
    #        capacite interdit — un echec doit nommer le fichier et la ligne, pas une
    #        version majeure.
    #   8.2  premiere cible reellement atteignable. C'est aussi la version ou les
    #        proprietes dynamiques se deprecient, et Doctrine 1 en fait un usage massif :
    #        c'est le risque de fond de cette montee.
    #   8.3  la plus recente que l'hebergement propose.
    #
    # Cette matrice est ce qui empeche le verdict de docs/.../compatibilite-php-8.adoc de
    # vieillir en silence. Elle a trouve deux defauts que la mesure locale n'avait pas vus,
    # des ses deux premieres executions : la contrainte php de composer.json, et
    # `doctrine:insert-sql` sous PHP 8.
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.2", "8.3"]

    # MariaDB 10.11, la version de production — la meme que docker-compose.yml.
    #
    # Ce service etait en mysql:5.7, au motif que c'etait « la version de production »
    # et que les agregats de l'API Subsonic dependaient de ONLY_FULL_GROUP_BY, actif
    # par defaut a partir de la 5.7. Les deux moities de ce motif etaient fausses :
    #
    #   - le site n'a jamais tourne que sur MariaDB. C'est le meme constat qui avait
    #     deja fait corriger docker-compose.yml, sans que ce fichier suive ;
    #   - MariaDB 10.11 n'active PAS ONLY_FULL_GROUP_BY, et la suite passe a l'identique
    #     avec ou sans lui. Mesure faite avant la bascule, en forcant le mode sur la base
    #     locale : unitaires et fonctionnels verts des deux cotes. Ce mode n'attrapait
    #     donc rien.
    #
    # Tester sous un moteur que la production n'emploie pas ne prouve rien sur la
    # production. C'est le seul argument qui compte ici.
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: musiqueapproximative
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v6
        with:
          path: src/vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Installer les dépendances
        # `--ignore-platform-req=php` pour 8.1 SEULEMENT.
        #
        # `src/composer.json` declare desormais `"php": "^7.4 || ^8.2"` : 7.4, 8.2 et 8.3
        # s'installent sans drapeau, et c'est ce qui PROUVE la declaration. Un drapeau
        # partout rendrait la contrainte inverifiable — elle redeviendrait une intention.
        #
        # 8.1 garde le drapeau parce qu'elle n'est pas declaree supportee, et elle ne l'est
        # pas parce que l'hebergement ne la propose pas (releve du 2026-08-29 : 7.4, 8.2,
        # 8.3, et `plesk-php81` n'est pas installable). Elle reste dans la matrice comme
        # temoin, pas comme cible : declarer une version qu'on ne peut pas servir serait
        # exactement le genre d'annonce non verifiee que cette matrice existe pour empecher.
        #
        # L'ordre a compte : le drapeau est tombe pour 8.2 et 8.3 AVANT que la contrainte
        # s'elargisse. L'inverse aurait elargi sans que rien ne le verifie.
        run: |
          cd src
          if [ "${{ matrix.php }}" = "8.1" ]; then
            composer install --prefer-dist --no-progress --ignore-platform-req=php
          else
            composer install --prefer-dist --no-progress
          fi

      - name: Générer la configuration
        # Rendu explicite plutôt que `make configure`. La cible du Makefile
        # construit sa liste de variables à la volée et son résultat s'est
        # révélé dépendre de la façon dont on l'invoque ; ici on veut un
        # comportement déterministe et vérifiable, pas la commodité.
        env:
          APP_AUTOPLAY: "0"
          APP_DOMAIN: localhost
          APP_THEME: musiqueapproximative
          APP_TITLE: Musique Approximative
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: musiqueapproximative
          DATABASE_NAME_TEST: musiqueapproximative_test
          DATABASE_USER: root
          DATABASE_PASSWORD: root
        # POURQUOI PYTHON ET PLUS `envsubst`
        #
        # `envsubst` vient de `gettext-base`, que l'image du runner ne fournit
        # pas : il fallait donc un `apt-get update` avant chaque suite de tests.
        # Le 2026-08-19, cette étape est restée bloquée trois fois de suite,
        # quinze minutes et plus, sans jamais atteindre le premier test. Faire
        # dépendre la suite de la disponibilité d'un miroir de paquets, c'est
        # accepter qu'elle échoue pour une raison qui n'a rien à voir avec le
        # code — et une CI qui pend pour rien finit par ne plus être lue.
        #
        # Python 3 est garanti par l'image. Rien à installer, rien à attendre.
        #
        # C'est aussi PLUS déterministe, ce que cette étape réclame. `envsubst`
        # substitue TOUT motif `$MOT` : sans liste blanche il vidait les clés
        # `$ref` d'un document OpenAPI et corrompait le fichier. Ici un nom hors
        # liste est rendu tel quel, par construction, sans rien à brider.
        run: |
          python3 - <<'RENDU'
          import os, pathlib, re, sys

          # Liste blanche explicite, écrite ici plutôt que déduite de
          # l'environnement : même choix d'explicite que le reste de l'étape.
          ATTENDUES = [
              "APP_AUTOPLAY", "APP_DOMAIN", "APP_THEME", "APP_TITLE",
              "DATABASE_HOST", "DATABASE_NAME", "DATABASE_NAME_TEST",
              "DATABASE_USER", "DATABASE_PASSWORD",
          ]

          # `envsubst` remplace une variable absente par du vide, en silence.
          # C'est exactement la panne que l'étape suivante cherche a rattraper :
          # autant refuser tout de suite.
          manquantes = [nom for nom in ATTENDUES if os.environ.get(nom) is None]
          if manquantes:
              sys.exit("::error::variables absentes de l'environnement : " + ", ".join(manquantes))

          valeurs = {nom: os.environ[nom] for nom in ATTENDUES}
          # `${NOM}` et `$NOM`, les deux formes que comprenait `envsubst`.
          motif = re.compile(r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}|\$([A-Za-z_][A-Za-z0-9_]*)")

          def remplacer(trouve):
              nom = trouve.group(1) or trouve.group(2)
              # Hors liste : on rend le texte d'origine intact.
              return valeurs.get(nom, trouve.group(0))

          for dist in sorted(pathlib.Path("src").rglob("*-dist")):
              rendu = dist.with_name(dist.name[: -len("-dist")])
              rendu.write_text(motif.sub(remplacer, dist.read_text(encoding="utf-8")), encoding="utf-8")
              print("rendu : " + str(rendu))
          RENDU

      - name: Vérifier la configuration rendue
        # La substitution a déjà produit des valeurs tronquées dans un autre
        # contexte : on ne fait pas confiance, on regarde.
        run: |
          cat src/config/databases.yml
          grep -q 'dbname=musiqueapproximative_test' src/config/databases.yml \
            || { echo "::error::la connexion de test est absente"; exit 1; }
          grep -q 'username: root' src/config/databases.yml \
            || { echo "::error::identifiant de connexion incorrect"; exit 1; }
          # Le contrat n'est plus rendu : il est versionné et servi tel quel.
          # Ce qu'on vérifie n'est donc plus qu'il a reçu son domaine, mais que
          # personne ne l'a retransformé en gabarit — un rendu serait ignoré par
          # git, et le déploiement se fait par `git pull`.
          test -f src/web/openapi.yaml-dist \
            && { echo "::error::src/web/openapi.yaml-dist est réapparu : le contrat doit rester versionné, pas généré"; exit 1; }
          grep -qE '\$\{[A-Z_]+\}' src/web/openapi.yaml \
            && { echo "::error::le contrat OpenAPI porte une variable non substituée"; exit 1; }
          grep -q "\$ref: '#/components" src/web/openapi.yaml \
            || { echo "::error::les références du contrat OpenAPI ont disparu"; exit 1; }
          grep -q 'domain: localhost' src/apps/frontend/config/app.yml \
            || { echo "::error::app.yml mal rendu"; exit 1; }

      - name: Créer la base de test et poser le sql_mode de production
        # Le sql_mode releve sur la production (SELECT @@sql_mode), et non suppose.
        # L'image MariaDB y ajoute STRICT_TRANS_TABLES : sans cette ligne la CI
        # echoue sur des ecritures que la production accepte en tronquant, et
        # laisse donc passer en production le defaut qu'elle vient de signaler.
        #
        # Pourquoi ici et non dans `options:` du service : les services d'Actions
        # ne permettent pas de surcharger la commande du conteneur — `options:`
        # passe a `docker create`, avant l'image, donc `--sql-mode=...` n'y a pas
        # sa place. `SET GLOBAL` est la seule voie, et elle suffit : toute
        # connexion ouverte ensuite en herite, ce qui est le cas de toutes celles
        # de la suite. Verifie, pas suppose.
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            SET GLOBAL sql_mode='ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION';
            CREATE DATABASE IF NOT EXISTS musiqueapproximative_test CHARACTER SET utf8mb4;"
          effectif=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e "SELECT @@session.sql_mode;")
          echo "sql_mode d'une connexion neuve : $effectif"
          test "$effectif" = "ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION" \
            || { echo "::error::le sql_mode de production n'a pas pris"; exit 1; }

      - name: Construire le schéma de test
        # Le contournement qui vivait ici — `|| echo` suivi d'une boucle de verification
        # des tables — est passe dans `musiqueapproximative:build-test-schema`.
        #
        # Il ne couvrait qu'un poste de travail sur deux : `make test-init` lance la meme
        # tache sans garde, et un developpeur voyait echouer sous PHP 8 ce que cette
        # verification voyait reussir. La tache du projet porte desormais la tolerance ET
        # la verification, donc les deux appelants ont le meme comportement.
        #
        # La tolerance reste etroite : seule l'exception « There is no active transaction »
        # est ignoree, et seulement apres que les tables attendues ont repondu.
        run: |
          cd src
          php symfony doctrine:build --sql --env=test
          php symfony musiqueapproximative:build-test-schema --env=test

      - name: Tests unitaires
        run: |
          cd src
          php symfony test:unit

      - name: Tests fonctionnels — frontend
        run: |
          cd src
          php symfony test:functional frontend

      - name: Tests fonctionnels — admin
        run: |
          cd src
          php symfony test:functional admin
