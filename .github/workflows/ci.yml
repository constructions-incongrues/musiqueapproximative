name: CI

on:
  push:
    tags: [v*]
  pull_request:
    branches: [main]
  # `Validation du code` et `Build et Push Docker` sont deux des trois contextes
  # exigés par le ruleset `main`. La file de fusion les attend sur la branche
  # `gh-readonly-queue/…` ; sans ce déclencheur elle patiente en vain.
  merge_group:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validation du code
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none

      - name: Navigation de la documentation complète
        # `docs/antora.yml` déclare `nav.adoc`. Quand ce fichier manquait, le site
        # n'avait aucune barre latérale et la seule voie vers une page était un
        # sommaire tenu à la main dans `index.adoc` — qui a dérivé jusqu'à laisser
        # huit pages sur seize hors d'atteinte, dont trois expliquant comment monter
        # l'environnement et lancer les tests. Une page publiée que personne ne peut
        # trouver n'est pas publiée. Ce contrôle nomme celles qui manquent.
        run: |
          nav=docs/modules/ROOT/nav.adoc
          test -f "$nav" || {
            echo "::error::$nav est absent alors que docs/antora.yml le déclare"
            exit 1
          }
          manquantes=0
          pages=$(cd docs/modules/ROOT/pages && find . -name '*.adoc' | sed 's|^\./||' | sort)
          for page in $pages; do
            grep -q "xref:${page}\[" "$nav" || {
              echo "::error file=docs/modules/ROOT/pages/${page}::page publiée absente de $nav"
              manquantes=$((manquantes + 1))
            }
          done
          test "$manquantes" -eq 0 || {
            echo "::error::$manquantes page(s) publiée(s) hors de la navigation"
            exit 1
          }
          echo "$(grep -c 'xref:' "$nav") entrées de navigation, aucune page orpheline"

      - name: Chaque story livrée pointe un change existant
        # Le 2026-08-18, trois stories livrées sont restées décochées : leur
        # change avait été nommé autrement que leur packet. Le plan comptait
        # dix-neuf stories livrées en croyant en compter seize.
        #
        # Le lien existe — chaque packet porte une ligne « **Change** : <nom> ».
        # Ce qui manquait, c'est de le vérifier : la moitié des stories cochées
        # avaient laissé cette ligne à sa valeur de gabarit, « pas encore
        # proposé », des jours après la livraison.
        #
        # Le contrôle est ASYMÉTRIQUE, et délibérément. Il n'exige pas qu'un
        # change archivé soit cité par une story : vingt des cinquante archives
        # sont antérieures au plan, et le travail hors plan est légitime.
        # Exiger la réciproque produirait vingt fausses alertes permanentes,
        # c'est-à-dire un contrôle qu'on désactive.
        run: |
          python3 - <<'VERIF'
          import os, re, sys

          plan = 'openspec/discovery.md'
          if not os.path.exists(plan):
              print('::error::%s est absent' % plan); sys.exit(1)

          racine = 'openspec/changes'
          archives = set(os.listdir(os.path.join(racine, 'archive')))
          actifs = {d for d in os.listdir(racine)
                    if d != 'archive' and os.path.isdir(os.path.join(racine, d))}

          def resout(nom):
              return nom in actifs or any(a == nom or a.endswith('-' + nom) for a in archives)

          contenu = open(plan, encoding='utf-8').read()
          fautives = []
          for bloc in re.split(r'\n(?=- \[[x~ ]\] \d+\. )', contenu):
              entete = re.match(r'- \[x\] (\d+)\. `?([^`\s]+)', bloc)
              if not entete:
                  continue
              numero, slug = entete.groups()
              declares = re.findall(r'\*\*Change\*\* : `([a-z0-9-]+)`', bloc)
              if not declares:
                  fautives.append((numero, slug, 'ne declare aucun change'))
              elif not any(resout(d) for d in declares):
                  fautives.append((numero, slug, 'declare %s, qui n existe pas' % declares[0]))

          for numero, slug, motif in fautives:
              print('::error file=%s::story %s (%s) : %s' % (plan, numero, slug, motif))

          if fautives:
              print('::error::%d story(s) cochee(s) sans change resolvant.' % len(fautives))
              print('Une story livree doit porter « **Change** : `<nom>` », verifie contre')
              print('openspec/changes/ ou son archive — pas deduit du slug de la story.')
              sys.exit(1)

          cochees = len(re.findall(r'^\s*- \[x\] \d+\. ', contenu, re.M))
          print('%d story(s) livree(s), toutes reliees a un change existant.' % cochees)
          VERIF

      - name: Validate composer.json
        run: |
          cd src
          composer validate --strict

      - name: Cache des dépendances Composer
        uses: actions/cache@v6
        with:
          path: src/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Installer les dépendances
        run: |
          cd src
          composer install --prefer-dist --no-progress

      - name: Check PHP syntax
        run: |
          find src -name "*.php" -not -path "*/vendor/*" -exec php -l {} \; | grep -v "No syntax errors"

  tests:
    name: Suite de tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # Les deux versions sont BLOQUANTES, et `fail-fast: false` les laisse toutes deux
    # rendre leur verdict. Une passe PHP 8 seulement consultative aurait vire au rouge
    # permanent puis a l'ignorance — c'est le mode de defaillance habituel des
    # verifications facultatives, et il vaut mieux ne pas l'ajouter que l'ajouter sans
    # dents.
    #
    # 7.4 est la version de production, 8.1 la version visee. Ce travail est ce qui
    # empeche le verdict de compatibilite de vieillir en silence : sans lui, le document
    # qui l'enonce n'est qu'un chiffre date de plus.
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1"]

    permissions:
      contents: read

    services:
      db:
        # MariaDB 10.11, et pas MySQL : c'est la version de la production, et le projet
        # n'a jamais tourne que sur MariaDB.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: musiqueapproximative
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none

      - name: Installer les dépendances
        # `--ignore-platform-req=php` hors 7.4, et SEULEMENT hors 7.4.
        #
        # `src/composer.json` declare `"php": "^7.4"` : composer refuse donc d'installer
        # sous 8.1, et c'est le verrou que l'audit a identifie — le seul de toute la
        # chaine, chaque dependance declarant deja PHP 8 de son cote.
        #
        # Le drapeau leve la verification de plateforme sans toucher a la declaration.
        # C'est deliberé : la production tourne en 7.4, le projet ne pretend pas encore
        # supporter PHP 8, et cette branche de matrice sert precisement a verifier AVANT
        # de declarer. Le lock reste celui de 7.4 et n'est pas resolu a nouveau.
        #
        # La branche 7.4 garde sa verification intacte : y poser le meme drapeau
        # masquerait une vraie incompatibilite de dependance sur la version de
        # production.
        #
        # Le jour ou la migration se fait, ce drapeau disparait et la contrainte
        # s'elargit — dans cet ordre, pas l'inverse.
        run: |
          cd src
          if [ "${{ matrix.php }}" = "7.4" ]; then
            composer install --prefer-dist --no-progress
          else
            composer install --prefer-dist --no-progress --ignore-platform-req=php
          fi

      - name: Rendre la configuration
        # `make configure` REFUSE de s'exécuter quand `.env` ne fournit aucune variable :
        # `envsubst` recopierait alors les gabarits verbatim et la configuration rendue
        # porterait le nom de la variable au lieu de sa valeur. Voir le commentaire en
        # tête de src/Makefile — cette cible a mis le site en 500 le 2026-08-18.
        run: |
          cd src
          cat > .env <<'ENV'
          APP_AUTOPLAY=false
          APP_DOMAIN=localhost
          APP_THEME=default
          APP_TITLE=Musique Approximative
          DATABASE_HOST=127.0.0.1
          DATABASE_NAME=musiqueapproximative
          DATABASE_NAME_TEST=musiqueapproximative_test
          DATABASE_USER=root
          DATABASE_PASSWORD=root
          CLOUDFLARE_API_TOKEN=
          CLOUDFLARE_ZONE_ID=
          ENV
          make configure

      - name: Préparer la base de test
        # Les fixtures commencent par des TRUNCATE : les tables doivent préexister.
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS musiqueapproximative_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          cd src
          php symfony doctrine:insert-sql --env=test

      # Pas d'etape d'isolation de `cache/` et `log/` : chaque branche de la matrice
      # part d'un depot fraichement clone, et ces deux repertoires sont gitignores —
      # ils sont donc vides par construction, et propres a leur version de PHP.
      #
      # La precision merite d'etre ecrite parce que la premiere mesure de ce change a
      # ete FAUSSE pour cette exacte raison : deux conteneurs partageaient src/cache/
      # avec des chemins de montage differents, et le cache d'autoload de l'un faisait
      # echouer l'autre au demarrage. L'echec ressemblait a une incompatibilite PHP 8 ;
      # il n'en etait pas une. Quiconque reproduira ces tests hors CI doit isoler ces
      # deux repertoires a la main.
      - name: Tests unitaires
        run: cd src && php symfony test:unit

      - name: Tests fonctionnels — frontend
        run: cd src && php symfony test:functional frontend

      - name: Tests fonctionnels — admin
        run: cd src && php symfony test:functional admin

  docker-build:
    name: Build et Push Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          # Seul un tag publie. La condition portait sur « tout sauf une pull
          # request », ce qui aurait fait publier une image depuis une branche
          # de file de fusion.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-alias-tags:
    name: Créer alias de version
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configurer git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Créer tags majeurs et mineurs
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f1,2)
          PATCH=$(echo $VERSION | cut -d. -f1,2,3)
          echo "Creating/Updating tags $MAJOR, $MINOR and $PATCH for $VERSION"
          git tag -f $MAJOR $GITHUB_SHA
          git tag -f $MINOR $GITHUB_SHA
          git tag -f $PATCH $GITHUB_SHA
          git push origin $MAJOR $MINOR $PATCH --force
