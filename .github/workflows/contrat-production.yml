name: Contrat en production

# Ce contrôle a son propre rendez-vous, et ce n'est pas une commodité.
#
# Il a d'abord été logé dans `nightly.yml`. Or ce workflow n'est jamais passé au
# vert : 122 exécutions depuis sa création le 2 janvier 2026, zéro succès. Une
# alerte posée dans un rendez-vous rouge en permanence est une alerte déjà
# éteinte : son signal ne se distingue pas du bruit auquel on s'est habitué.
# C'est exactement le mode de défaillance que ce contrôle prétendait éviter.
#
# Il lui faut donc pouvoir passer au rouge tout seul.

on:
  schedule:
    - cron: 0 8 * * 1-5
  workflow_dispatch: {}

permissions: read-all

jobs:
  contrat:
    name: Contrat servi en production
    runs-on: ubuntu-latest

    # Ce contrôle existe parce que la suite ne peut pas le faire. Elle confronte
    # le site de TEST au contrat ; elle ne demande jamais rien à la production.
    # Le 2026-08-18, elle a déclaré le contrat conforme à chaque exécution
    # pendant que `/openapi.yaml` répondait 404 en ligne, une journée entière.
    #
    # Il ne vérifie donc QUE ce que le déploiement peut casser, et rien de ce que
    # la suite couvre déjà.
    steps:
      - name: Interroger le contrat en ligne
        env:
          CONTRAT: https://www.musiqueapproximative.net/openapi.yaml
        run: |
          # Deux échecs à ne pas confondre : une production INJOIGNABLE n'est pas
          # un contrat FAUX. Une alerte qui crie au loup se désactive en trois
          # semaines — ce contrôle ne signale donc que ce qu'il peut affirmer.
          statut=""
          for essai in 1 2 3; do
            statut=$(curl -sS -o /tmp/contrat.yaml -w '%{http_code}' \
              --max-time 30 --retry 0 "$CONTRAT" || echo "000")
            case "$statut" in
              000|5??) echo "essai $essai : statut $statut, nouvel essai"; sleep 20 ;;
              *) break ;;
            esac
          done

          case "$statut" in
            000|5??)
              echo "::notice::Production injoignable (statut $statut) après trois essais."
              echo "Ce n'est pas la question posée : le contrat n'est ni confirmé ni infirmé."
              exit 0
              ;;
          esac

          echec=0

          test "$statut" = "200" || {
            echo "::error::Le contrat répond $statut à $CONTRAT. Il n'est pas servi."
            echec=1
          }

          type=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 30 "$CONTRAT")
          case "$type" in
            *yaml*|*text/plain*) ;;
            *) echo "::error::Type de média « $type », attendu du YAML."; echec=1 ;;
          esac

          if [ "$statut" = "200" ]; then
            grep -qE '\$\{[A-Z_]+\}' /tmp/contrat.yaml && {
              echo "::error::Le contrat servi porte une variable non substituée :"
              grep -oE '\$\{[A-Z_]+\}' /tmp/contrat.yaml | sort -u | sed 's/^/  /'
              echec=1
            }

            routes=$(grep -cE "^  /" /tmp/contrat.yaml || true)
            test "$routes" -ge 9 || {
              echo "::error::Le contrat servi déclare $routes routes, moins que les 9 attendues."
              echec=1
            }
            echo "Contrat servi : statut $statut, type $type, $routes routes, aucune variable restante."
          fi

          exit "$echec"

      - name: Interroger l'encodage de la connexion
        env:
          ENCODAGE: https://www.musiqueapproximative.net/encodage
        run: |
          # Meme distinction que pour le contrat : une production INJOIGNABLE
          # n'est pas un encodage FAUX. On lit le verdict plutot que le seul
          # statut HTTP — la route repond 503 quand la base est injoignable, et
          # ce cas doit etre reessaye, pas signale comme une non-conformite.
          statut=""
          for essai in 1 2 3; do
            statut=$(curl -sS -o /tmp/encodage.json -w '%{http_code}' \
              --max-time 30 "$ENCODAGE" || echo "000")
            case "$statut" in
              000|5??) echo "essai $essai : statut $statut, nouvel essai"; sleep 20 ;;
              *) break ;;
            esac
          done

          case "$statut" in
            000|5??)
              echo "::notice::Encodage indeterminable (statut $statut) apres trois essais."
              echo "La base est injoignable ou le site est en panne : ce n'est pas la question posee."
              exit 0
              ;;
          esac

          verdict=$(sed -n 's/.*"verdict"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/encodage.json | head -1)
          constate=$(sed -n 's/.*"encodage_constate"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/encodage.json | head -1)

          case "$verdict" in
            conforme)
              echo "Encodage de connexion : conforme ($constate)."
              # Ce que le vert ne dit pas, imprime a cote pour qu'il ne soit pas
              # lu comme une preuve que les titres survivent.
              sed -n 's/.*"caracteres_hors_cp1252_stockes"[[:space:]]*:[[:space:]]*\([0-9]*\).*/  caracteres hors cp1252 reellement stockes : \1/p' /tmp/encodage.json
              sed -n 's/.*"titres_alteres_en_base"[[:space:]]*:[[:space:]]*\([0-9]*\).*/  titres alteres encore en base            : \1/p' /tmp/encodage.json
              ;;
            indetermine)
              echo "::notice::Encodage indetermine — la verification a repondu sans pouvoir conclure."
              ;;
            *)
              echo "::error::Encodage de connexion NON CONFORME : « $constate » au lieu de « utf8mb4 »."
              echo "::error::Tout caractere hors cp1252 saisi est detruit a l'ecriture, silencieusement."
              echo "::error::Voir docs/modules/ROOT/pages/fichiers-de-configuration.adoc"
              exit 1
              ;;
          esac
