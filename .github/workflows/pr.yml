name: Pull Request

# `merge_group` est requis : `Trunk Check` est un contexte exigé par le ruleset
# `main`, et la file de fusion l'attend sur la branche `gh-readonly-queue/…`.
# Sans ce déclencheur, rien n'y tourne, la file patiente soixante minutes puis
# éjecte la pull request — ce qui a fait passer la fusion automatique pour
# inopérante pendant des mois.
on: [pull_request, workflow_dispatch, merge_group]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  trunk_check:
    name: Trunk Check Runner
    runs-on: ubuntu-latest
    permissions:
      checks: write # For trunk to post annotations

    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.3.1

      - name: Cache Trunk
        uses: trunk-io/trunk-action@v1

      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          # Désactivé : l'étape interne « Download annotations artifact » de
          # trunk-action construit un appel github-script avec un run_id vide
          # lorsque l'upload d'annotations est sauté, et le job échoue sur un
          # SyntaxError alors que le lint est passé. Le workflow était rouge en
          # continu depuis février 2026 pour cette raison.
          post-annotations: false
