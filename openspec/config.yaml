schema: behaviour-driven

context: |
  Musique Approximative — playlist quotidienne collaborative du collectif
  Constructions Incongrues. Site en production : https://www.musiqueapproximative.net

  Stack : Symfony 1.5 (legacy, fin de vie) + Doctrine 1.3, PHP 7.4, MySQL,
  templates PHP. jQuery côté client, lecteur audio jPlayer.
  Dev sous Docker Compose (nginx :8080, PHP :8001). Déploiement **automatique** :
  Plesk tire `main` à chaque poussée, il n'y a pas de geste de mise en ligne. Une
  fusion sur `main` est donc une mise en production, et le `make deploy` par rsync
  que décrit encore le Makefile est déprécié.

  Deux applications : `src/apps/frontend` (public) et `src/apps/admin`.
  Modèle central : `Post` (track_author, track_title, track_filename, body en Markdown,
  slug, publish_on, contributeur `sfGuardUser`).
  Plugin maison notable : `sfDesastrePlugin` (effets aléatoires, `desastres.yml`).

  Contrat public à préserver — aucun test automatisé ne le couvre aujourd'hui.
  Routes réelles, telles que définies dans `src/apps/frontend/config/routing.yml` :
  `/` (redirection vers le dernier morceau), `/post/:slug`, `/post/md5/:md5sum`,
  `/posts`, `/posts/feed`, `/posts/next`, `/posts/prev`, `/posts/random`, `/oembed`.
  Formats de sortie : `json` (jsonapi.org), `xspf`, `max` (Max/MSP), flux RSS 2.01,
  oEmbed (JSON et XML) ; métadonnées OpenGraph.

  Ce contrat est spécifié en détail dans `openspec/specs/`, qui fait foi sur le
  comportement observable. Une banque de mémoire tenue à la main a existé sous
  `docs/memory-bank/` ; elle a été supprimée après avoir dérivé au point de
  documenter cinq routes inexistantes et un lecteur audio abandonné. Ne pas la
  recréer : le corpus de specs joue ce rôle, et il est validé par l'outil.

  Conventions du dépôt :
  - Commits : Conventional Commits (release-please gère version et CHANGELOG).
  - Documentation de référence : AsciiDoc / Antora sous `docs/`. OpenSpec ne la
    remplace pas — les artefacts décrivent un changement, `docs/` décrit l'état stable.
  - Langue : tout est rédigé en français (artefacts, specs, tâches, commits).
  - Le code legacy ne se refactore pas à l'occasion : un change ne touche que ce
    qu'il annonce.

  Backlog : `openspec/discovery.md` est le plan de release, produit par la
  compétence discovery. Lorsqu'un change est demandé sans requête précise,
  prendre la prochaine story non cochée de ce fichier et utiliser son packet
  comme entrée. Une story par change, une seule à la fois.

# Les règles de rédaction du projet — français, section « Hors périmètre »,
# comportement observable plutôt qu'implémentation, vérification manuelle —
# étaient portées par le schéma `musique-approximative`. Depuis le passage à
# `behaviour-driven`, elles sont déclarées ici : le schéma actif est rédigé en
# anglais et ne les couvre pas. Ne subsistent ci-dessous que les consignes que
# le schéma ne porte pas lui-même.
#
# `musique-approximative` reste sous `openspec/schemas/` : le retour en arrière
# tient à la valeur de `schema:` en tête de ce fichier.

rules:
  proposal:
    - "Rédiger en français. Seuls restent en anglais les titres que l'outil
      analyse par leur nom : `## Why`, `## What Changes`."
    - "Ajouter une section « Hors périmètre », qui dit ce que le changement ne
      fait délibérément pas. Elle est obligatoire : sur du code legacy, la
      tentation de corriger « tant qu'on y est » est le premier facteur de dérive."
    - Nommer les capacités en kebab-case et en français, par exemple
      `flux-syndication` ou `catalogue-morceaux`.
    - Dire explicitement si le contrat public est concerné.
    - "Lorsqu'une contrainte du socle legacy oriente la solution retenue, la
      documenter plutôt que de la laisser implicite : dans l'artefact `design`
      s'il est produit, sinon dans la proposition."
  specs:
    - "Rédiger en français. Restent en anglais les seuls repères que l'outil
      analyse : `## ADDED|MODIFIED|REMOVED|RENAMED Requirements`,
      `### Requirement:`, `## Purpose`, et les mots normatifs `SHALL` et `MUST`."
    - "Écrire chaque scénario `#### Scénario : <nom>`, avec exactement quatre
      dièses, et son corps en `- **QUAND**`, `- **ALORS**`, `- **ET**`. C'est la
      forme des 104 scénarios déjà versés sous `openspec/specs/`."
    - Ne jamais mentionner Symfony ni Doctrine dans une spec. Ils ont vocation à
      disparaître, pas le comportement.
    - "Test rapide : si l'implémentation peut changer sans que le comportement
      observable bouge, cela n'a pas sa place dans une spec."
  design:
    - Rédiger en français.
    - "Ne produire cet artefact que si le changement est structurant : plusieurs
      modules, schéma de données, dépendance nouvelle, migration. La plupart des
      changes de ce dépôt n'en ont pas besoin."
  tasks:
    - Rédiger en français.
    - "Terminer par une section de vérification manuelle. La suite Lime sous
      `src/test/` couvre une partie du contrat public, pas sa totalité : les
      tâches de vérification doivent être assez précises pour être exécutées par
      quelqu'un d'autre — quelle URL demander, quoi regarder dans la réponse,
      quel résultat attendre."
    - Une case cochée signifie vérifiée, jamais « probablement bon ». Si une
      vérification n'a pas pu être menée, laisser sa case décochée et le dire en
      clair dans le fichier.

operations:
  archive:
    guidance:
      - Vérifier que `docs/` reflète le nouvel état stable avant d'archiver.
