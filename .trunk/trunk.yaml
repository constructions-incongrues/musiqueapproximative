# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml

version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - php@>=8.0.0
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.10
    - checkov@3.2.497
    - dotenv-linter@4.0.0
    - git-diff-check
    - hadolint@2.14.0
    - markdownlint@0.47.0
    - osv-scanner@2.3.1
    - oxipng@10.0.0
    - prettier@3.7.4
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - svgo@4.0.0
    - trufflehog@3.92.4
    - yamllint@1.37.1
  ignore:
    # Fichiers générés par `openspec init` / `openspec update`, et artefacts dont la
    # structure est imposée par le schéma OpenSpec (titres de section en `##`, ce que
    # markdownlint MD041 refuse). Les reformater serait annulé à la régénération.
    # Seuls les linters de forme sont désactivés : trufflehog et git-diff-check restent actifs.
    - linters: [markdownlint, prettier]
      paths:
        - .claude/**
        - openspec/**
    # Le contrat OpenAPI decrit une API PUBLIQUE et NON AUTHENTIFIEE. Les regles
    # checkov ci-dessous exigent une section `security` et un plafond sur les
    # tableaux ; les satisfaire demanderait de declarer des faits faux :
    #   CKV_OPENAPI_4/5 — une authentification qui n'existe pas ;
    #   CKV_OPENAPI_21  — un `maxItems` sur `/posts`, que le site ne borne pas
    #                     (decision de l'auteur : la page entiere sert au CTRL+F).
    # Ce document dit ce que le site sert. Le faire mentir pour satisfaire un
    # linter serait exactement ce qu'il est fait pour empecher.
    - linters: [checkov]
      paths:
        - src/web/openapi.yaml
    # prettier casse ce fichier, ce n'est pas une preference de style. Il eclate
    # `required: [a, b, c]` en sequence de flux multiligne, forme que le parseur
    # YAML de Symfony 1 (`sfYaml`) ne sait pas lire : « Unable to parse line 480 ([) ».
    # Or c'est ce parseur qui lit le contrat dans le test qui le confronte au
    # site. Formater ce document le rendrait illisible par ce qui le verifie.
    - linters: [prettier]
      paths:
        - src/web/openapi.yaml
    # Dependances tierces versionnees, servies telles qu'elles sont distribuees :
    # Redoc 2.5.3, GSAP 3.13.0, SplitText 3.13.0, anime.js 3.2.2. Les trois dernieres
    # ont ete versees le 2026-08-19 pour la meme raison que la premiere : les desastres
    # les appelaient depuis deux CDN, sur des pages publiques.
    # On ne reformate pas et on n'analyse pas le code de quelqu'un d'autre : le
    # modifier romprait la correspondance avec la somme de controle notee dans
    # vendor/PROVENANCE.md, qui est ce qui rend le versement verifiable.
    - linters: [ALL]
      paths:
        - src/web/frontend/assets/javascripts/redoc/**
        - src/web/frontend/assets/javascripts/gsap/**
        - src/web/frontend/assets/javascripts/animejs/**
    # `version: "1.11.0" # x-release-please-version` : les guillemets sont
    # redondants pour YAML mais la ligne est reecrite par release-please. On ne
    # touche pas a la forme d'une ligne qu'un automate edite.
    - linters: [yamllint]
      paths:
        - src/web/openapi.yaml
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
tools:
  disabled:
    - phpstan
