services:
  db:
    environment:
      MARIADB_DATABASE: musiqueapproximative
      MARIADB_ROOT_PASSWORD: root
    # MariaDB, et cette version precisement : c'est celle de la production
    # (10.11.14). Le conteneur etait en mysql:5.7.25 alors que le site n'a
    # jamais tourne que sur MariaDB — le dump d'amorcage lui-meme est produit
    # par MariaDB 10.11. Faire repeter une migration de schema sur un autre
    # moteur que la cible n'a pas de sens.
    #
    # Effet de bord bienvenu : plus de `platform: linux/amd64`. MySQL 5.7 n'a
    # pas d'image arm64 et tournait en emulation ; MariaDB en a une native.
    image: mariadb:10.11
    # Le sql_mode de la production, releve sur elle (SELECT @@sql_mode) et non
    # suppose. L'image ajoute STRICT_TRANS_TABLES, que la production n'a pas :
    # sans cette ligne, le conteneur refuse bruyamment des ecritures que la
    # production accepte en tronquant en silence, et le developpement ne voit
    # jamais le comportement qu'il est cense reproduire.
    #
    # ONLY_FULL_GROUP_BY reste donc absent, comme en production — contrairement
    # a ce que .github/workflows/tests.yml a longtemps affirme.
    command: --sql-mode=ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
    volumes:
      - ./var/db:/var/lib/mysql
      - ./src/data/fixtures/musiqueapproximative.sql:/docker-entrypoint-initdb.d/00_musiqueapproximative.sql

  php:
    build: .
    # Le script de routage est indispensable : sans lui, php -S traite tout
    # chemin contenant un point comme un fichier statique et repond 404 sans
    # atteindre Symfony, ce qui rend /rest/ping.view injoignable en local.
    command:
      [
        /bin/sh,
        -c,
        make configure && composer install && php -S 0.0.0.0:8000 -t web web/router.php,
      ]
    depends_on:
      - db
    ports:
      - 8001:8000
    volumes:
      - ./src:/usr/local/src
      - ./etc/${PROFILE-musiqueapproximative.localhost}/.env:/usr/local/src/.env

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
